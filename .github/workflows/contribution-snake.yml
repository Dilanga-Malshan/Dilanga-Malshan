name: Contribution snake

on:
  push:
    branches: [main]
    paths: ['.github/workflows/contribution-snake.yml']
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contribution-snake.svg?palette=github-light&color_snake=purple
            assets/contribution-snake-dark.svg?palette=github-dark&color_snake=purple

      - name: Honor reduced motion preferences
        run: |
          python3 - <<'PY'
          from pathlib import Path

          reduced_motion = """
          @media (prefers-reduced-motion: reduce) {
            .c, .u { animation: none !important; }
            .s { display: none; }
          }
          """
          for filename in ("contribution-snake.svg", "contribution-snake-dark.svg"):
              path = Path("assets") / filename
              svg = path.read_text(encoding="utf-8")
              path.write_text(svg.replace("</style>", reduced_motion + "</style>", 1), encoding="utf-8")
          PY

      - name: Commit updated animation
        run: |
          git add assets/contribution-snake.svg assets/contribution-snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Refresh contribution snake animation'
          git push origin HEAD:main
