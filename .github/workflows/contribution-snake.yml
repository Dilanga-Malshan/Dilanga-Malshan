name: Contribution snake

on:
  push:
    branches: [main]
    paths: ['.github/workflows/contribution-snake.yml']
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contribution-snake.svg?palette=github-light&color_snake=#8250DF
            assets/contribution-snake-dark.svg?palette=github-dark&color_snake=#A371F7

      - name: Style the contribution calendar
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          themes = {
              "contribution-snake.svg": (
                  "#D0D7DE", "#656D76",
              ),
              "contribution-snake-dark.svg": (
                  "#30363D", "#9198A1",
              ),
          }

          for filename, (border, label) in themes.items():
              path = Path("assets") / filename
              svg = path.read_text(encoding="utf-8")
              dimensions = re.search(
                  r'viewBox="(-?\d+) (-?\d+) (\d+) (\d+)" width="\d+" height="\d+"',
                  svg,
              )
              if dimensions is None or "</style>" not in svg:
                  raise ValueError(f"Unexpected SVG layout in {path}")
              left, top, width, height = map(int, dimensions.groups())
              cell_size = -left
              left -= 42
              width += 42
              height += 32

              weekdays = ("Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat")
              weekday_labels = "".join(
                  f'<text x="-23" y="{row * cell_size + cell_size / 2 + 4}"'
                  f' text-anchor="end">{day}</text>'
                  for row, day in enumerate(weekdays)
              )
              legend_right = left + width - 24
              legend_y = top + height - 24
              swatches = "".join(
                  f'<rect x="{legend_right - 120 + i * 18}" y="{legend_y - 10}"'
                  f' width="13" height="13" rx="3" style="fill:var(--{color})"'
                  f' stroke="{border}"/>'
                  for i, color in enumerate(("ce", "c1", "c2", "c3", "c4"))
              )

              styles = f"""
              .calendar-labels {{
                fill: {label};
                font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
              }}
              @media (prefers-reduced-motion: reduce) {{
                .c, .u {{ animation: none !important; }}
                .s {{ display: none; }}
              }}
              """
              labels = f"""
              <g class="calendar-labels">
                {weekday_labels}
                <text x="{left + 24}" y="{legend_y}">Last 12 months</text>
                <text x="{legend_right - 128}" y="{legend_y}" text-anchor="end">Less</text>
                {swatches}
                <text x="{legend_right}" y="{legend_y}" text-anchor="end">More</text>
              </g>
              """
              svg = svg.replace(
                  dimensions.group(),
                  f'viewBox="{left} {top} {width} {height}" width="{width}" height="{height}"',
                  1,
              )
              svg = svg.replace("</style>", styles + "</style>" + labels, 1)
              path.write_text(svg, encoding="utf-8")
          PY

      - name: Commit updated animation
        run: |
          git add assets/contribution-snake.svg assets/contribution-snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Refresh contribution snake animation'
          git push origin HEAD:main
