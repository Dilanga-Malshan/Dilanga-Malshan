name: Contribution snake

on:
  push:
    branches: [main]
    paths: ['.github/workflows/contribution-snake.yml']
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contribution-snake.svg?palette=github-light&color_snake=#2563EB&color_dots=#E2EAF6,#BFDBFE,#93C5FD,#3B82F6,#1D4ED8
            assets/contribution-snake-dark.svg?palette=github-dark&color_snake=#38BDF8&color_dots=#1B2C44,#164E63,#0369A1,#0EA5E9,#67E8F9

      - name: Style the contribution calendar
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          themes = {
              "contribution-snake.svg": (
                  "#F8FBFF", "#EDF4FF", "#CDDBF0", "#1D4ED8", "#0284C7", "#0369A1",
              ),
              "contribution-snake-dark.svg": (
                  "#0E192B", "#121F36", "#293E5F", "#38BDF8", "#67E8F9", "#7DD3FC",
              ),
          }

          for filename, (background, tint, border, blue, cyan, glow) in themes.items():
              path = Path("assets") / filename
              svg = path.read_text(encoding="utf-8")
              dimensions = re.search(
                  r'viewBox="(-?\d+) (-?\d+) (\d+) (\d+)" width="\d+" height="\d+"',
                  svg,
              )
              if dimensions is None or "</style>" not in svg:
                  raise ValueError(f"Unexpected SVG layout in {path}")
              left, top, width, height = map(int, dimensions.groups())
              height += 16

              styles = f"""
              .c {{ rx: 3px; ry: 3px; stroke: none; }}
              .s {{ filter: drop-shadow(0 0 2px {glow}); }}
              .s.s0 {{ fill: url(#snake-head) {blue}; }}
              .s.s2 {{ opacity: .85; }}
              .s.s3 {{ opacity: .7; }}
              @media (prefers-reduced-motion: reduce) {{
                .c, .u {{ animation: none !important; }}
                .s {{ display: none; }}
              }}
              """
              panel = f"""
              <defs>
                <linearGradient id="calendar-panel" x2="100%" y2="100%">
                  <stop stop-color="{background}"/>
                  <stop offset="1" stop-color="{tint}"/>
                </linearGradient>
                <linearGradient id="snake-head" x2="100%" y2="100%">
                  <stop stop-color="{cyan}"/>
                  <stop offset="1" stop-color="{blue}"/>
                </linearGradient>
              </defs>
              <rect x="{left + 1}" y="{top + 1}" width="{width - 2}" height="{height - 2}" rx="18"
                    fill="url(#calendar-panel)" stroke="{border}"/>
              """
              svg = svg.replace(
                  dimensions.group(),
                  f'viewBox="{left} {top} {width} {height}" width="{width}" height="{height}"',
                  1,
              )
              svg = svg.replace("</style>", styles + "</style>" + panel, 1)
              path.write_text(svg, encoding="utf-8")
          PY

      - name: Commit updated animation
        run: |
          git add assets/contribution-snake.svg assets/contribution-snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Refresh contribution snake animation'
          git push origin HEAD:main
